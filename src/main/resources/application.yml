server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: personal-ledger
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:com/ledger/modules/**/mapper/xml/*.xml
  type-aliases-package: com.ledger.modules.**.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true

# Knife4j 配置
knife4j:
  enable: false
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    enable-version: false
    enable-reload-cache-parameter: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-api-method-type-parameter: multipart/form-data
    enable-request-cache: true
    enable-host: false
    enable-host-text: localhost:8080
    enable-home: false
    enable-home-text: 个人云端记账本
    enable-debug: true
    enable-footer: false
    enable-footer-text: Powered by Knife4j

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    enabled: true
    path: /v3/api-docs
  group-configs:
    - group: 用户模块
      paths-to-match: /api/user/**,/api/auth/**
      packages-to-scan: com.ledger.modules.user
    - group: 账目模块
      paths-to-match: /api/account/**
      packages-to-scan: com.ledger.modules.account
    - group: 预算模块
      paths-to-match: /api/budget/**
      packages-to-scan: com.ledger.modules.budget
    - group: 统计模块
      paths-to-match: /api/statistics/**
      packages-to-scan: com.ledger.modules.statistics
    - group: 导出模块
      paths-to-match: /api/export/**
      packages-to-scan: com.ledger.modules.export

# Actuator 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# JWT 配置
jwt:
  # Access Token 有效期（秒）：2小时
  access-token-expiration: 7200
  # Refresh Token 有效期（秒）：7天
  refresh-token-expiration: 604800
  # 密钥（生产环境通过环境变量 JWT_SECRET 覆盖）
  secret: ledger-dev-jwt-secret-key-please-change-in-production-environment-2026

# 日志配置
logging:
  level:
    root: INFO
    com.ledger: DEBUG
    org.springframework.security: INFO
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
