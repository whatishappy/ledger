version: '3.8'

services:
  # 个人记账本应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-ledger:latest
    container_name: ledger-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=192.168.10.101
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=ledger
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - REDIS_HOST=192.168.10.101
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-ledger-prod-jwt-secret-key-change-me-2026-production-environment}
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ledger-net

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: ledger-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ledger-net

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: ledger-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - ledger-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  ledger-net:
    driver: bridge
